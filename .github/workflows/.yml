name: Unity Tests CI

on:
  push:
    branches:
      - JosuePruebasUnitarias
  pull_request:
    branches:
      - JosuePruebasUnitarias

env:
  PROJECT_PATH: .   # si tus tests están en Assets/Tests dentro de la raíz

jobs:
  test:
    name: Run Unit Tests Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List test files
        run: |
          echo "Archivos de test encontrados:"
          find ${{ env.PROJECT_PATH }}/Assets/Tests -name "*.cs" -type f

      - name: Validate tests
        run: |
          EXPECTED_TESTS=2
          TEST_FILES=$(find ${{ env.PROJECT_PATH }}/Assets/Tests -name "*Tests.cs" -type f | wc -l)
          echo "Tests esperados: $EXPECTED_TESTS"
          echo "Tests encontrados: $TEST_FILES"

          if [ "$TEST_FILES" -ne "$EXPECTED_TESTS" ]; then
            echo "ERROR: Numero de tests incorrecto"
            exit 1
          fi

          echo "Todos los tests encontrados correctamente"
