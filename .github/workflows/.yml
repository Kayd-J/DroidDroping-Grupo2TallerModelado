name: Unity CI

on:
  push:
    branches:
      - JosuePruebasUnitarias
  pull_request:
    branches:
      - JosuePruebasUnitarias

jobs:

  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('**/*.cs') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Install Unity
        uses: game-ci/unity-installer@v3
        with:
          unityVersion: 6000.0.27f1

      - name: Build project (no output)
        uses: game-ci/unity-builder@v3
        with:
          unityVersion: 6000.0.27f1
          targetPlatform: StandaloneWindows64

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unity
        uses: game-ci/unity-installer@v3
        with:
          unityVersion: 6000.0.27f1

      - name: Run all tests
        uses: game-ci/unity-test-runner@v3
        with:
          unityVersion: 6000.0.27f1
          testMode: playmode
          artifactsPath: test-results
