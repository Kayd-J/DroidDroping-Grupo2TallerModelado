name: Unity Tests CI

on:
  push:
  pull_request:

env:
  PROJECT_PATH: AvatarsVSRooksGame


jobs:
  test:
    name: Run Unit Tests Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List test files
        run: |
          echo "Archivos de test encontrados:"
          find ${{ env.PROJECT_PATH }}/Assets/Tests -name "*.cs" -type f

      - name: Validate Test1SpendCoins
        run: |
          TEST_FILE="${{ env.PROJECT_PATH }}/Assets/Tests/Test1SpendCoins.cs"
          if [ ! -f "$TEST_FILE" ]; then
            echo "ERROR: Archivo Test1SpendCoins.cs no encontrado"
            exit 1
          fi
          TEST_COUNT=$(grep -c "^\s*\[Test\]" "$TEST_FILE" || echo "0")
          echo "Tests activos en Test1SpendCoins.cs: $TEST_COUNT"
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "ERROR: No hay tests activos en Test1SpendCoins.cs"
            exit 1
          fi

      - name: Validate Test2CanAfford
        run: |
          TEST_FILE="${{ env.PROJECT_PATH }}/Assets/Tests/Test2CanAfford.cs"
          if [ ! -f "$TEST_FILE" ]; then
            echo "ERROR: Archivo Test2CanAfford.cs no encontrado"
            exit 1
          fi
          TEST_COUNT=$(grep -c "^\s*\[Test\]" "$TEST_FILE" || echo "0")
          echo "Tests activos en Test2CanAfford.cs: $TEST_COUNT"
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "ERROR: No hay tests activos en Test2CanAfford.cs"
            exit 1
          fi

      - name: Verification Success
        run: |
          echo "======================================"
          echo "VERIFICACION COMPLETADA EXITOSAMENTE"
          echo "======================================"
