name: Unity Tests CI

on:
  push:
  pull_request:

env:
  PROJECT_PATH: AvatarsVSRooksGame

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verificar estructura del proyecto
        run: |
          echo "Verificando estructura del proyecto..."
          ls -la ${{ env.PROJECT_PATH }}/
          echo ""
          echo "Carpeta Assets:"
          ls -la ${{ env.PROJECT_PATH }}/Assets/
          echo ""
          echo "Carpeta Tests:"
          ls -la ${{ env.PROJECT_PATH }}/Assets/Tests/
      
      - name: Build Success
        run: echo "Build check completado exitosamente"

  test:
    name: Run Unit Tests Verification
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verificar archivos de test
        run: |
          echo "Archivos de test encontrados:"
          find ${{ env.PROJECT_PATH }}/Assets/Tests -name "*Tests.cs" -type f
      
      - name: Contar y validar tests
        run: |
          echo "Contando tests..."
          TEST_COUNT=$(grep -r "\[Test\]" ${{ env.PROJECT_PATH }}/Assets/Tests/ | wc -l)
          echo "Total de metodos de test encontrados: $TEST_COUNT"
          
          EXPECTED_TESTS=6
          
          if [ $TEST_COUNT -eq 0 ]; then
            echo "ERROR: No se encontraron metodos de test"
            exit 1
          fi
          
          if [ $TEST_COUNT -ne $EXPECTED_TESTS ]; then
            echo "ERROR: Se esperaban $EXPECTED_TESTS tests pero se encontraron $TEST_COUNT"
            echo "Algun test fue modificado o eliminado"
            exit 1
          fi
          
          echo "OK: Numero correcto de tests ($TEST_COUNT)"
          echo ""
          echo "Lista de tests:"
          grep -rn "\[Test\]" ${{ env.PROJECT_PATH }}/Assets/Tests/ | grep -A1 "\[Test\]"
      
      - name: Verificar estructura de tests
        run: |
          echo "Verificando estructura de las clases de test..."
          for file in ${{ env.PROJECT_PATH }}/Assets/Tests/*Tests.cs; do
            if [ -f "$file" ]; then
              echo "--- $(basename $file) ---"
              echo "Clases encontradas:"
              grep "class.*Tests" "$file" || echo "No se encontro clase de test"
              echo ""
              echo "Metodos de test:"
              grep -E "void Test[0-9]" "$file" | wc -l
              echo ""
            fi
          done
      
      - name: Tests Verification Success
        run: |
          echo "======================================"
          echo "VERIFICACION DE TESTS COMPLETADA"
          echo "======================================"
          echo ""
          TEST_COUNT=$(grep -r "\[Test\]" ${{ env.PROJECT_PATH }}/Assets/Tests/ | wc -l)
          echo "Total de tests validados: $TEST_COUNT"
          echo ""
          echo "Todos los tests estructuralmente correctos"