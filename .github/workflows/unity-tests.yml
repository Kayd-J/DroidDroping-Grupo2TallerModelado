name: Unity Tests CI

on:
  push:
  pull_request:

# Variable para la ruta del proyecto
env:
  PROJECT_PATH: AvatarsVSRooksGame

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verificar estructura del repositorio
        run: |
          echo "Estructura del repositorio:"
          ls -la
          echo ""
          echo "Contenido del proyecto Unity:"
          ls -la ${{ env.PROJECT_PATH }}/
      
      - name: Verificar carpeta Assets
        run: |
          if [ -d "${{ env.PROJECT_PATH }}/Assets" ]; then
            echo "Carpeta Assets encontrada"
            ls -la ${{ env.PROJECT_PATH }}/Assets/
          else
            echo "ERROR: Carpeta Assets NO encontrada"
            exit 1
          fi
      
      - name: Verificar carpeta Tests
        run: |
          if [ -d "${{ env.PROJECT_PATH }}/Assets/Tests" ]; then
            echo "Carpeta Tests encontrada"
            ls -la ${{ env.PROJECT_PATH }}/Assets/Tests/
          else
            echo "ERROR: Carpeta Tests NO encontrada"
            exit 1
          fi
      
      - name: Verificar archivos .asmdef
        run: |
          echo "Buscando archivos Assembly Definition..."
          find ${{ env.PROJECT_PATH }} -name "*.asmdef" -type f
          echo "Assembly Definitions encontrados"
      
      - name: Build Success
        run: echo "Build check completado exitosamente"

  test:
    name: Test Check
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Buscar archivos de test
        run: |
          echo "Buscando archivos de test..."
          echo "Archivo principal: CoinBehaviourTests.cs"
          if [ -f "${{ env.PROJECT_PATH }}/Assets/Tests/CoinBehaviourTests.cs" ]; then
            echo "CoinBehaviourTests.cs encontrado"
          else
            echo "ADVERTENCIA: CoinBehaviourTests.cs NO encontrado"
          fi
          echo ""
          echo "Todos los archivos *Tests.cs:"
          find ${{ env.PROJECT_PATH }}/Assets/Tests -name "*Tests.cs" -type f
          echo ""
      
      - name: Contar métodos de test
        run: |
          echo "Contando métodos de test..."
          TEST_COUNT=$(grep -r "\[Test\]" ${{ env.PROJECT_PATH }}/Assets/Tests/ | wc -l)
          echo "Se encontraron $TEST_COUNT métodos con atributo [Test]"
          
          if [ $TEST_COUNT -eq 0 ]; then
            echo "ERROR: No se encontraron métodos de test"
            exit 1
          fi
      
      - name: Mostrar contenido de archivos de test
        run: |
          echo "Archivos de test encontrados:"
          for file in ${{ env.PROJECT_PATH }}/Assets/Tests/*Tests.cs; do
            if [ -f "$file" ]; then
              echo "--- $(basename $file) ---"
              grep -E "(class|void Test)" "$file" | head -n 10
              echo ""
            fi
          done
      
      - name: Verificar que tests pueden ejecutarse
        run: |
          TEST_FILES=$(find ${{ env.PROJECT_PATH }}/Assets/Tests -name "*Tests.cs" | wc -l)
          if [ $TEST_FILES -eq 0 ]; then
            echo "ERROR: No se encontraron archivos de test"
            exit 1
          else
            echo "Se encontraron $TEST_FILES archivo(s) de test"
          fi
      
      - name: Test Check Success
        run: echo "Todos los tests verificados exitosamente"