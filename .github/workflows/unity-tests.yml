name: Unity Tests CI

on:
  push:
  pull_request:

env:
  PROJECT_PATH: AvatarsVSRooksGame

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verificar estructura del proyecto
        run: |
          echo "Verificando estructura del proyecto..."
          ls -la ${{ env.PROJECT_PATH }}/
          echo ""
          echo "Carpeta Assets:"
          ls -la ${{ env.PROJECT_PATH }}/Assets/
          echo ""
          echo "Carpeta Tests:"
          ls -la ${{ env.PROJECT_PATH }}/Assets/Tests/
      
      - name: Build Success
        run: echo "Build check completado exitosamente"

  test:
    name: Run Unit Tests Verification
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verificar archivos de test
        run: |
          echo "Archivos de test encontrados:"
          find ${{ env.PROJECT_PATH }}/Assets/Tests -name "*Tests.cs" -type f
      
      - name: Contar y validar tests en CoinBehaviourTests
        run: |
          echo "==================================="
          echo "VALIDACION DE TESTS"
          echo "==================================="
          echo ""
          
          TEST_FILE="${{ env.PROJECT_PATH }}/Assets/Tests/CoinBehaviourTests.cs"
          
          if [ ! -f "$TEST_FILE" ]; then
            echo "ERROR: Archivo CoinBehaviourTests.cs no encontrado"
            exit 1
          fi
          
          echo "Archivo encontrado: $TEST_FILE"
          echo ""
          
          TEST_COUNT=$(grep -c "^\s*\[Test\]" "$TEST_FILE" || echo "0")
          echo "Total de tests activos encontrados: $TEST_COUNT"
          echo ""
          
          EXPECTED_TESTS=6
          echo "Tests esperados: $EXPECTED_TESTS"
          echo ""
          
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "ERROR: No se encontraron tests activos"
            echo "Todos los [Test] estan comentados"
            exit 1
          fi
          
          if [ "$TEST_COUNT" -ne "$EXPECTED_TESTS" ]; then
            echo "ERROR: Numero de tests incorrecto"
            echo "  Esperados: $EXPECTED_TESTS"
            echo "  Encontrados: $TEST_COUNT"
            echo "  Diferencia: $(($EXPECTED_TESTS - $TEST_COUNT)) tests faltantes"
            echo ""
            echo "Algun test fue comentado o eliminado"
            exit 1
          fi
          
          echo "EXITO: Numero correcto de tests ($TEST_COUNT)"
          echo ""
          echo "Tests encontrados:"
          grep -n "^\s*\[Test\]" "$TEST_FILE" || true
      
      - name: Verificar metodos de test
        run: |
          echo "Verificando metodos de test..."
          TEST_FILE="${{ env.PROJECT_PATH }}/Assets/Tests/CoinBehaviourTests.cs"
          
          echo "Metodos Test encontrados:"
          grep -E "void Test[0-9]" "$TEST_FILE" || echo "Ninguno"
          
          COMMENTED_TESTS=$(grep -c "//\s*\[Test\]" "$TEST_FILE" || echo "0")
          echo ""
          echo "Tests comentados detectados: $COMMENTED_TESTS"
          
          if [ "$COMMENTED_TESTS" -gt 0 ]; then
            echo "ADVERTENCIA: Hay tests comentados que no se estan ejecutando"
          fi
      
      - name: Tests Verification Success
        run: |
          echo "======================================"
          echo "VERIFICACION COMPLETADA EXITOSAMENTE"
          echo "======================================"
          echo ""
          TEST_FILE="${{ env.PROJECT_PATH }}/Assets/Tests/CoinBehaviourTests.cs"
          TEST_COUNT=$(grep -c "^\s*\[Test\]" "$TEST_FILE" || echo "0")
          echo "Total de tests validados: $TEST_COUNT"
          echo ""
          echo "Todos los tests estan correctamente configurados"